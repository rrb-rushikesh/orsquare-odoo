<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment 4 - Keypad</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .wrap { display: flex; justify-content: center; padding: 28px 12px 60px; }
  /* counter-style: a big number and a keypad, built for touch screens and fast hands */
  .pad { width: 100%; max-width: 360px; background: var(--canvas); border: 1px solid var(--line); }
  .dir { display: grid; grid-template-columns: 1fr 1fr; }
  .dir button { border: 0; padding: 15px; font-weight: 600; cursor: pointer; background: var(--layer); color: var(--muted); }
  .dir button.on.in { background: var(--rec); color: #fff; } .dir button.on.out { background: var(--pay); color: #fff; }
  .who { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; background: var(--canvas); }
  .hint { padding: 8px 16px; font-size: 12px; } .hint.rec { color: var(--rec-fg); background: var(--rec-bg); } .hint.pay { color: var(--pay-fg); background: var(--pay-bg); } .hint.adv { color: var(--adv); background: var(--layer-accent); } .hint.zero { color: var(--muted); background: var(--layer); }
  .disp { padding: 22px 16px 10px; text-align: right; font-size: 54px; font-weight: 300; letter-spacing: -.02em; min-height: 96px; }
  .disp small { color: var(--subtle); font-size: 28px; margin-right: 4px; }
  .quick { display: flex; gap: 6px; padding: 0 16px 12px; justify-content: flex-end; flex-wrap: wrap; }
  .quick button { border: 1px solid var(--line); background: var(--canvas); padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
  .keys button { border: 0; background: var(--canvas); padding: 20px 0; font-size: 22px; cursor: pointer; }
  .keys button:active { background: var(--layer-2); }
  .mode { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .mode button { border: 0; padding: 13px; background: var(--canvas); cursor: pointer; font-weight: 500; }
  .mode button + button { border-left: 1px solid var(--line); } .mode button.on { background: var(--ink); color: #fff; }
  .go { width: 100%; border: 0; padding: 20px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; }
  .go.in { background: var(--rec); } .go.out { background: var(--pay); } .go:disabled { background: var(--disabled); }
</style></head>
<body>
<div class="proto-bar"><a href="../index.html">&larr; All prototypes</a><b>Payment 4 &middot; Keypad</b></div>
<div class="wrap"><div class="pad">
  <div class="dir" id="dir"><button data-d="in" class="on in">Receive</button><button data-d="out">Pay</button></div>
  <select class="who" id="party"></select><div class="hint" id="hint"></div>
  <div class="disp num" id="disp"></div><div class="quick" id="quick"></div>
  <div class="keys" id="keys"></div>
  <div class="mode" id="mode"><button class="on">Cash</button><button>UPI</button></div>
  <button class="go in" id="go" disabled>Receive</button></div></div>
<script src="../shared/data.js"></script>
<script>
let dir = 'in', mode = 'Cash', val = '';
const $ = (id) => document.getElementById(id);
const cur = () => PARTIES.find((p) => p.id === $('party').value);
$('keys').innerHTML = ['1','2','3','4','5','6','7','8','9','C','0','⌫'].map((k) => `<button data-k="${k}">${k}</button>`).join('');
function draw() {
  $('party').innerHTML = PARTIES.filter((p) => (dir === 'in') === isReceive(p)).map((p) => `<option value="${p.id}">${p.name}</option>`).join(''); update();
}
function update() {
  const p = cur(); const n = Number(val) || 0;
  const cls = p.balance > 0 ? (dir === 'in' ? 'rec' : 'pay') : p.balance < 0 ? 'adv' : 'zero';
  $('hint').className = 'hint ' + cls;
  $('hint').textContent = p.balance > 0 ? `${dir === 'in' ? 'Receivable' : 'Payable'} ${inr(p.balance)}` : p.balance < 0 ? `Advance ${inr(-p.balance)}` : 'Settled';
  $('disp').innerHTML = `<small>₹</small>${val ? Number(val).toLocaleString('en-IN') : '0'}`;
  $('quick').innerHTML = p.balance > 0 ? [p.balance, Math.round(p.balance / 2), 500, 1000].filter((v, i, a) => v > 0 && v <= p.balance && a.indexOf(v) === i).map((v, i) => `<button data-v="${v}">${i === 0 ? 'Full ' : ''}${inr(v)}</button>`).join('') : '';
  $('go').className = 'go ' + dir; $('go').disabled = !n; $('go').textContent = n ? `${dir === 'in' ? 'Receive' : 'Pay'} ${inr(n)} by ${mode}` : (dir === 'in' ? 'Receive' : 'Pay');
}
$('keys').onclick = (e) => { const k = e.target.dataset.k; if (!k) return; if (k === 'C') val = ''; else if (k === '⌫') val = val.slice(0, -1); else if (val.length < 9) val += k; update(); };
$('quick').onclick = (e) => { if (e.target.dataset.v) { val = e.target.dataset.v; update(); } };
$('dir').onclick = (e) => { const d = e.target.dataset.d; if (!d) return; dir = d; val = ''; [...$('dir').children].forEach((b) => { b.className = b.dataset.d === d ? 'on ' + d : ''; }); draw(); };
$('mode').onclick = (e) => { if (e.target.tagName !== 'BUTTON') return; mode = e.target.textContent; [...$('mode').children].forEach((b) => b.classList.toggle('on', b === e.target)); update(); };
$('party').onchange = () => { val = ''; update(); };
$('go').onclick = () => { $('go').textContent = 'Saved. Prototype only.'; $('go').disabled = true; };
draw();
</script></body></html>
