<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment 3 - Bill allocation</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .wrap { display: flex; justify-content: center; padding: 32px 12px 60px; }
  /* type the amount once; the form spreads it over the oldest open bills and shows the result */
  .box { width: 100%; max-width: 620px; background: var(--canvas); border: 1px solid var(--line); }
  .top { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px; border-bottom: 1px solid var(--line); background: var(--layer); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  select, input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-bottom: 1px solid var(--ink); background: var(--canvas); border-radius: 0; }
  .amt { font-size: 22px; font-weight: 300; }
  .tabs { display: flex; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 14px 4px; margin-right: 22px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 500; }
  .tabs button.on { color: var(--ink); border-color: var(--ink); }
  .tabs button.on.in { border-color: var(--rec); } .tabs button.on.out { border-color: var(--pay); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 20px; font-weight: 600; }
  td { padding: 12px 20px; border-top: 1px solid var(--line); } th.r, td.r { text-align: right; }
  td.alloc { font-weight: 600; } .full { color: var(--rec-fg); } .none { color: var(--subtle); }
  .bar { height: 4px; background: var(--layer-2); margin-top: 6px; } .bar i { display: block; height: 100%; background: var(--ink); }
  .result { padding: 16px 20px; border-top: 1px solid var(--ink); display: grid; gap: 4px; }
  .result div { display: flex; justify-content: space-between; }
  .result .adv { color: var(--adv); font-weight: 600; }
  .go { display: block; width: calc(100% - 40px); margin: 0 20px 20px; padding: 15px; border: 0; color: #fff; font-weight: 600; cursor: pointer; }
  .go.in { background: var(--rec); } .go.out { background: var(--pay); } .go:disabled { background: var(--disabled); }
  .empty { padding: 28px 20px; color: var(--muted); }
</style></head>
<body>
<div class="proto-bar"><a href="../index.html">&larr; All prototypes</a><b>Payment 3 &middot; Bill allocation</b></div>
<div class="wrap"><div class="box">
  <div class="tabs" id="tabs"><button data-d="in" class="on in">Receive</button><button data-d="out">Pay</button></div>
  <div class="top"><div><label id="pl">Customer</label><select id="party"></select></div>
    <div><label>Amount</label><input class="amt num" id="amt" inputmode="decimal" placeholder="0"></div>
    <div><label>Paid by</label><select id="mode"><option>Cash</option><option>UPI</option></select></div></div>
  <div id="table"></div><div class="result" id="result"></div>
  <button class="go in" id="go" disabled>Save</button></div></div>
<script src="../shared/data.js"></script>
<script>
let dir = 'in';
const $ = (id) => document.getElementById(id);
const parties = () => PARTIES.filter((p) => (dir === 'in') === isReceive(p));
const cur = () => PARTIES.find((p) => p.id === $('party').value);
function allocate(p, amount) {           // oldest bill first
  let left = amount; const rows = p.bills.map((b) => { const a = Math.min(left, b.due); left -= a; return { ...b, a }; });
  return { rows, extra: left };
}
function draw() {
  $('pl').textContent = dir === 'in' ? 'Customer' : 'Supplier';
  $('party').innerHTML = parties().map((p) => `<option value="${p.id}">${p.name}</option>`).join('');
  update();
}
function update() {
  const p = cur(); const amt = Number($('amt').value) || 0; const { rows, extra } = allocate(p, amt);
  $('table').innerHTML = p.bills.length ? `<table><thead><tr><th>Bill</th><th>Date</th><th class="r">Open</th><th class="r">This payment</th></tr></thead><tbody>${rows.map((r) =>
    `<tr><td>${r.no}</td><td>${r.date}</td><td class="r num ${dir === 'in' ? 'rec-t' : 'pay-t'}">${inr(r.due)}</td><td class="r alloc num ${r.a === r.due ? 'full' : r.a ? '' : 'none'}">${r.a ? inr(r.a) : '-'}${r.a === r.due ? ' &#10003;' : ''}<div class="bar"><i style="width:${(r.a / r.due) * 100}%"></i></div></td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">${p.name} has no open bills${p.balance < 0 ? ` and has ${inr(-p.balance)} in advance` : ''}.</div>`;
  const total = p.bills.reduce((s, b) => s + b.due, 0);
  $('result').innerHTML = `<div><span>Total open</span><span class="num">${inr(total)}</span></div><div><span>This payment</span><span class="num">${inr(amt)}</span></div>
    <div><span>Still ${dir === 'in' ? 'receivable' : 'payable'} after</span><span class="num ${total - amt > 0 ? (dir === 'in' ? 'rec-t' : 'pay-t') : 'zero-t'}">${inr(Math.max(total - amt, 0))}</span></div>
    ${extra > 0 ? `<div class="adv"><span>Kept as advance</span><span class="num">${inr(extra)}</span></div>` : ''}`;
  $('go').className = 'go ' + dir; $('go').disabled = !amt; $('go').textContent = amt ? `${dir === 'in' ? 'Receive' : 'Pay'} ${inr(amt)}` : 'Enter an amount';
}
$('tabs').onclick = (e) => { const d = e.target.dataset.d; if (!d) return; dir = d; [...$('tabs').children].forEach((b) => { b.className = b.dataset.d === d ? 'on ' + d : ''; }); $('amt').value = ''; draw(); };
$('party').onchange = update; $('amt').oninput = update;
$('go').onclick = () => { $('go').textContent = 'Saved. Prototype only, nothing was stored.'; $('go').disabled = true; };
draw();
</script></body></html>
