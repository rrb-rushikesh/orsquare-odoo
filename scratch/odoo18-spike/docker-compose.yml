services:
  db:
    image: postgres:16
    container_name: odoo18-spike-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    ports:
      - "5433:5432"
    volumes:
      - odoo18-spike-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: odoo18-spike-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8069"
      - "8089:8072"
    volumes:
      - ./config:/etc/odoo
      - ../../addons:/mnt/extra-addons
      - ./spikes:/mnt/spikes
      - odoo18-spike-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

volumes:
  odoo18-spike-db-data:
  odoo18-spike-web-data:
