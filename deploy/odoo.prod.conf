[options]
; One Odoo process pool serves every shop database; each shop = one PostgreSQL database.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
db_host = postgres
db_port = 5432
db_user = odoo
; db_password comes from the container environment (PASSWORD_FILE secret)

; Shops are provisioned by the platform operator, never through Odoo's database manager.
list_db = False
admin_passwd = CHANGE_ME_LONG_RANDOM
; Only ORSquare shop databases are reachable. A request can never address another database.
dbfilter = ^orsquare_(shop[a-z0-9_]*|platform)$

; REQUIRED: with many databases Odoo only routes server-wide modules until a database is chosen. The
; sign-in and gate endpoints must answer guests (no session, no database yet), so orsquare is server-wide.
server_wide_modules = base,web,orsquare,orsquare_platform

; Run behind Caddy.
proxy_mode = True
workers = 4
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 1342177280
limit_memory_hard = 1610612736
log_level = info
; Odoo's own web assets/UI are not exposed by the proxy; keep the server lean.
without_demo = all
